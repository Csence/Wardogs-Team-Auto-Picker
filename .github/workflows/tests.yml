name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    # the script uses pywin32 and Windows screen capture, so the tests need Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python pywin32 mss psutil keyboard numpy pytest

      - name: Run unit tests
        run: python -m pytest tests/unit -v

      - name: Run integration tests
        run: python -m pytest tests/integration -v
